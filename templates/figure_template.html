<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Root-based scaling */
        html {
            font-size: 16px;
        }
        
        /* Bootstrap-inspired principles */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            background: white;
            font-family: Georgia, serif;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        /* Generic figure styling */
        figure {
            margin: 1em auto;
            text-align: center;
            max-width: 1200px;
        }
        
        figure img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0.5em auto;
        }
        
        figcaption {
            font-size: 0.9em;
            font-style: italic;
            margin-top: 0.5em;
            text-align: center;
        }
        
        /* Standalone image styling */
        .standalone-image {
            margin: 1em auto;
            text-align: center;
            max-width: 1200px;
        }
        
        .standalone-image img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        [css_content]
    </style>
</head>
<body>
    [figure_html]
</body>
</html>
