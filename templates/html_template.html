<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="file://[mathjax_abs_path]"></script>
    <style>
        /* Root-based scaling */
        html {
            font-size: 16px;
        }
        
        /* Bootstrap-inspired principles */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: white;
            font-size: 1rem;
        }
        
        #equation-container {
            display: inline-block;
            padding: [padding];
            background: white;
            max-width: [container_width];
        }
    </style>
</head>
<body>
    <div id="equation-container">
        [mathml_str]
    </div>
</body>
</html>
